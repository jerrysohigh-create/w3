    <text x="48" y="220" fill="#72d7da" font-family="Arial, Helvetica, sans-serif" font-size="154" font-weight="700">02</text>
    <text x="48" y="275" fill="#d9dcdf" font-family="ui-monospace, monospace" font-size="20" letter-spacing="4">SOURCE-LABELED</text>
  </g>
  <g transform="translate(790 380)">
