<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">MAGNE.AI BOX business architecture</title>
  <desc id="desc">Enterprise tasks, local knowledge and agent tools pass through a local control plane into model, knowledge and sandbox execution. Results remain local; only optional authorization, digest and settlement evidence enters the W3 trust lane.</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="cyanWash" x1="0" x2="1">
      <stop offset="0" stop-color="#74d8dd" stop-opacity=".12"/>
      <stop offset="1" stop-color="#74d8dd" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="redWash" x1="0" x2="1">
      <stop offset="0" stop-color="#ff655d" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ff655d" stop-opacity=".015"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#74d8dd"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#91f488"/>
    </marker>
    <style>
      .bg{fill:#08090b}.grid{fill:url(#grid)}.line{fill:none;stroke:#30343a;stroke-width:1.5}.cyan-line{fill:none;stroke:#74d8dd;stroke-width:2}.dash{stroke-dasharray:7 8}.red-line{fill:none;stroke:#ff655d;stroke-width:1.7}.title{fill:#f3f4f4;font:700 38px Inter,Arial,sans-serif;letter-spacing:-1px}.subtitle{fill:#8d929b;font:500 15px 'IBM Plex Mono',Consolas,monospace;letter-spacing:2px}.label{fill:#74d8dd;font:600 14px 'IBM Plex Mono',Consolas,monospace;letter-spacing:2px}.label-red{fill:#ff817a;font:600 13px 'IBM Plex Mono',Consolas,monospace;letter-spacing:1.8px}.step{fill:#747a84;font:500 12px 'IBM Plex Mono',Consolas,monospace;letter-spacing:1.7px}.head{fill:#f2f3f3;font:650 21px Inter,Arial,sans-serif}.head-compact{font-size:18px}.head-lane{font-size:17px}.copy{fill:#9b9fa8;font:500 13px Inter,Arial,sans-serif}.mono{fill:#aeb2ba;font:500 12px 'IBM Plex Mono',Consolas,monospace}.mini{fill:#737984;font:500 11px 'IBM Plex Mono',Consolas,monospace;letter-spacing:.5px}.result{fill:#91f488;font:600 13px 'IBM Plex Mono',Consolas,monospace;letter-spacing:1.3px}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <rect class="grid" width="1600" height="1050"/>
  <path d="M45 126H1555" class="line"/>
  <text x="55" y="65" class="title">MAGNE.AI BOX / LOCAL AGENT BUSINESS ARCHITECTURE</text>
  <text x="55" y="99" class="subtitle">PRIVATE INPUT · CONTROLLED EXECUTION · CITED OUTPUT · OPTIONAL VERIFIABLE EVIDENCE</text>
  <text x="1545" y="65" text-anchor="end" class="label">PUBLIC ARCHITECTURE / 2026.08</text>

  <rect x="55" y="150" width="1165" height="160" fill="#0b0d10" stroke="#30343a" stroke-width="1.5"/>
  <text x="78" y="181" class="step">01 / BUSINESS AND AGENT ENTRY</text>
  <g transform="translate(80 204)">
    <rect width="250" height="78" fill="url(#cyanWash)" stroke="#3a4148"/>
    <text x="18" y="27" class="head head-compact">ENTERPRISE WORKSPACE</text>
    <text x="18" y="54" class="copy">Private files · people · workflows</text>
  </g>
  <g transform="translate(368 204)">
    <rect width="250" height="78" fill="#0f1114" stroke="#3a4148"/>
    <text x="18" y="27" class="head">APPLICATION + API</text>
    <text x="18" y="54" class="copy">Web console · OpenAI-compatible SDK</text>
  </g>
  <g transform="translate(656 204)">
    <rect width="250" height="78" fill="#0f1114" stroke="#3a4148"/>
    <text x="18" y="27" class="head">AGENT TASK</text>
    <text x="18" y="54" class="copy">MCP · Skills · scheduled workflow</text>
  </g>
  <g transform="translate(944 204)">
    <rect width="250" height="78" fill="#0f1114" stroke="#3a4148"/>
    <text x="18" y="27" class="head">HUMAN APPROVAL</text>
    <text x="18" y="54" class="copy">Mobile / wallet for high-risk actions</text>
  </g>

  <path d="M205 282V344M493 282V344M781 282V344M1069 282V344" class="cyan-line" marker-end="url(#arrowCyan)"/>
  <rect x="55" y="345" width="1165" height="176" fill="#0b0d10" stroke="#74d8dd" stroke-opacity=".56" stroke-width="1.7"/>
  <rect x="55" y="345" width="8" height="176" fill="#74d8dd" opacity=".65"/>
  <text x="82" y="378" class="label">02 / MAGNE LOCAL CONTROL PLANE</text>
  <text x="82" y="410" class="head">IDENTITY, POLICY AND AUDIT BEFORE EXECUTION</text>
  <g transform="translate(80 438)">
    <rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">IDENTITY + TENANT</text><text x="15" y="44" class="mini">device · user · Agent</text>
  </g>
  <g transform="translate(300 438)">
    <rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">POLICY + APPROVAL</text><text x="15" y="44" class="mini">scope · limit · consent</text>
  </g>
  <g transform="translate(520 438)">
    <rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">SESSION + MEMORY</text><text x="15" y="44" class="mini">context · profile · state</text>
  </g>
  <g transform="translate(740 438)">
    <rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">ROUTE + ADMISSION</text><text x="15" y="44" class="mini">local-first · fallback off</text>
  </g>
  <g transform="translate(960 438)">
    <rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">AUDIT + MONITOR</text><text x="15" y="44" class="mini">health · logs · receipt</text>
  </g>

  <path d="M410 521V568M637 521V568M865 521V568" class="cyan-line" marker-end="url(#arrowCyan)"/>
  <rect x="55" y="570" width="1165" height="264" fill="#0b0d10" stroke="#30343a" stroke-width="1.5"/>
  <text x="78" y="603" class="step">03 / LOCAL EXECUTION PLANE</text>
  <g transform="translate(80 625)">
    <rect width="335" height="180" fill="url(#redWash)" stroke="#ff655d" stroke-opacity=".5"/>
    <text x="20" y="31" class="label-red">MODEL RUNTIME</text>
    <text x="20" y="65" class="head">GGUF LOAD + LLM / VLM</text>
    <text x="20" y="98" class="mono">llama.cpp-compatible runtime</text>
    <text x="20" y="123" class="mono">scheduler · KV cache · streaming</text>
    <text x="20" y="148" class="mono">MAGNE Custom NPU backend</text>
  </g>
  <g transform="translate(445 625)">
    <rect width="335" height="180" fill="url(#cyanWash)" stroke="#74d8dd" stroke-opacity=".48"/>
    <text x="20" y="31" class="label">KNOWLEDGE + AI SERVICES</text>
    <text x="20" y="65" class="head">RAG LIVES LOCALLY</text>
    <text x="20" y="98" class="mono">parse · OCR · document</text>
    <text x="20" y="123" class="mono">embedding · rerank · citation</text>
    <text x="20" y="148" class="mono">ASR / TTS · vision services</text>
  </g>
  <g transform="translate(810 625)">
    <rect width="385" height="180" fill="#0f1114" stroke="#3a4148"/>
    <text x="20" y="31" class="label">TOOL + ACTION SANDBOX</text>
    <text x="20" y="65" class="head">AGENT EXECUTES WITHIN POLICY</text>
    <text x="20" y="98" class="mono">MCP / Skills · file service</text>
    <text x="20" y="123" class="mono">isolated tools · system access</text>
    <text x="20" y="148" class="mono">approval gate · failure recovery</text>
  </g>

  <path d="M247 805V858M612 805V858M1002 805V858" class="cyan-line" marker-end="url(#arrowGreen)"/>
  <rect x="55" y="860" width="1165" height="74" fill="#0c100e" stroke="#91f488" stroke-opacity=".48" stroke-width="1.5"/>
  <text x="80" y="892" class="result">04 / LOCAL BUSINESS RESULT</text>
  <text x="80" y="918" class="mono">CITED ANSWER · APPROVED TOOL ACTION · LOCAL AUDIT RECORD · OPTIONAL SIGNED RECEIPT</text>

  <rect x="55" y="956" width="1165" height="62" fill="#0d0e11" stroke="#30343a"/>
  <text x="78" y="983" class="step">DEVICE FOUNDATION</text>
  <text x="285" y="992" class="head">UBUNTU · ARM64 HOST · MAGNE CUSTOM NPU · 3D DRAM · LOCAL STORAGE</text>

  <rect x="1260" y="150" width="285" height="868" fill="#0b0d10" stroke="#ff655d" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="1260" y="150" width="7" height="868" fill="#ff655d" opacity=".7"/>
  <text x="1288" y="185" class="label-red">OPTIONAL / W3 TRUST LANE · TARGET</text>
  <text x="1288" y="220" class="head head-lane">EVIDENCE, NOT PRIVATE DATA</text>
  <path d="M1220 433H1290" class="red-line dash" marker-end="url(#arrowCyan)"/>
  <path d="M1220 894H1290" class="red-line dash" marker-end="url(#arrowCyan)"/>
  <g transform="translate(1288 270)">
    <text class="step" y="0">01</text><text x="45" y="0" class="mono">DEVICE + AGENT ID</text>
    <path d="M0 20H225" class="line"/>
  </g>
  <g transform="translate(1288 355)">
    <text class="step" y="0">02</text><text x="45" y="0" class="mono">POLICY APPROVAL</text>
    <path d="M0 20H225" class="line"/>
  </g>
  <g transform="translate(1288 440)">
    <text class="step" y="0">03</text><text x="45" y="0" class="mono">SIGNED RECEIPT</text>
    <path d="M0 20H225" class="line"/>
  </g>
  <g transform="translate(1288 525)">
    <text class="step" y="0">04</text><text x="45" y="0" class="mono">AUDIT DIGEST</text>
    <path d="M0 20H225" class="line"/>
  </g>
  <g transform="translate(1288 610)">
    <text class="step" y="0">05</text><text x="45" y="0" class="mono">AGENTPAY SETTLEMENT</text>
    <path d="M0 20H225" class="line"/>
  </g>
  <text x="1288" y="705" class="label-red">NEVER ON-CHAIN</text>
  <text x="1288" y="740" class="mono">Enterprise files</text>
  <text x="1288" y="770" class="mono">Prompts + full output</text>
  <text x="1288" y="800" class="mono">Private keys</text>
  <text x="1288" y="830" class="mono">Raw knowledge base</text>
  <rect x="1288" y="878" width="225" height="84" fill="#111216" stroke="#30343a"/>
  <text x="1305" y="909" class="step">DEFAULT STATE</text>
  <text x="1305" y="939" class="head">LOCAL / OFF-CHAIN</text>
</svg>
