<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">MAGNE.AI BOX 本地 Agent 業務架構</title>
  <desc id="desc">企業任務、本地知識與 Agent 工具先進入本地控制面，再由模型、知識和工具沙箱執行。結果留在本地，只有可選授權、摘要和結算憑證進入 W3 信任通道。</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <linearGradient id="cyanWash" x1="0" x2="1"><stop offset="0" stop-color="#74d8dd" stop-opacity=".12"/><stop offset="1" stop-color="#74d8dd" stop-opacity=".01"/></linearGradient>
    <linearGradient id="redWash" x1="0" x2="1"><stop offset="0" stop-color="#ff655d" stop-opacity=".11"/><stop offset="1" stop-color="#ff655d" stop-opacity=".015"/></linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#74d8dd"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#91f488"/></marker>
    <style>
      .bg{fill:#08090b}.grid{fill:url(#grid)}.line{fill:none;stroke:#30343a;stroke-width:1.5}.cyan-line{fill:none;stroke:#74d8dd;stroke-width:2}.dash{stroke-dasharray:7 8}.red-line{fill:none;stroke:#ff655d;stroke-width:1.7}.title{fill:#f3f4f4;font:700 38px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;letter-spacing:-1px}.subtitle{fill:#8d929b;font:500 15px 'IBM Plex Mono',Consolas,monospace;letter-spacing:2px}.label{fill:#74d8dd;font:600 14px 'IBM Plex Mono','Microsoft JhengHei',sans-serif;letter-spacing:2px}.label-red{fill:#ff817a;font:600 13px 'IBM Plex Mono','Microsoft JhengHei',sans-serif;letter-spacing:1.8px}.step{fill:#747a84;font:500 12px 'IBM Plex Mono','Microsoft JhengHei',sans-serif;letter-spacing:1.7px}.head{fill:#f2f3f3;font:650 21px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif}.copy{fill:#9b9fa8;font:500 13px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif}.mono{fill:#aeb2ba;font:500 12px 'IBM Plex Mono','Microsoft JhengHei',sans-serif}.mini{fill:#737984;font:500 11px 'IBM Plex Mono','Microsoft JhengHei',sans-serif;letter-spacing:.5px}.result{fill:#91f488;font:600 13px 'IBM Plex Mono','Microsoft JhengHei',sans-serif;letter-spacing:1.3px}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1050"/><rect class="grid" width="1600" height="1050"/>
  <path d="M45 126H1555" class="line"/>
  <text x="55" y="65" class="title">MAGNE.AI BOX / 本地 AGENT 業務架構</text>
  <text x="55" y="99" class="subtitle">私有輸入 · 受控執行 · 帶引用輸出 · 可選可驗證憑證</text>
  <text x="1545" y="65" text-anchor="end" class="label">公開架構 / 2026.08</text>

  <rect x="55" y="150" width="1165" height="160" fill="#0b0d10" stroke="#30343a" stroke-width="1.5"/>
  <text x="78" y="181" class="step">01 / 業務與 AGENT 入口</text>
  <g transform="translate(80 204)"><rect width="250" height="78" fill="url(#cyanWash)" stroke="#3a4148"/><text x="18" y="27" class="head">企業 WORKSPACE</text><text x="18" y="54" class="copy">私有檔案 · 人員 · 工作流程</text></g>
  <g transform="translate(368 204)"><rect width="250" height="78" fill="#0f1114" stroke="#3a4148"/><text x="18" y="27" class="head">應用 + API</text><text x="18" y="54" class="copy">Web 控制台 · OpenAI 相容 SDK</text></g>
  <g transform="translate(656 204)"><rect width="250" height="78" fill="#0f1114" stroke="#3a4148"/><text x="18" y="27" class="head">AGENT 任務</text><text x="18" y="54" class="copy">MCP · Skills · 排程工作流</text></g>
  <g transform="translate(944 204)"><rect width="250" height="78" fill="#0f1114" stroke="#3a4148"/><text x="18" y="27" class="head">人工批准</text><text x="18" y="54" class="copy">手機／錢包批准高風險操作</text></g>

  <path d="M205 282V344M493 282V344M781 282V344M1069 282V344" class="cyan-line" marker-end="url(#arrowCyan)"/>
  <rect x="55" y="345" width="1165" height="176" fill="#0b0d10" stroke="#74d8dd" stroke-opacity=".56" stroke-width="1.7"/>
  <rect x="55" y="345" width="8" height="176" fill="#74d8dd" opacity=".65"/>
  <text x="82" y="378" class="label">02 / MAGNE 本地控制面</text>
  <text x="82" y="410" class="head">先完成身份、策略與審計，再進入執行</text>
  <g transform="translate(80 438)"><rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">身份 + 租戶</text><text x="15" y="44" class="mini">裝置 · 使用者 · Agent</text></g>
  <g transform="translate(300 438)"><rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">策略 + 批准</text><text x="15" y="44" class="mini">範圍 · 限額 · 同意</text></g>
  <g transform="translate(520 438)"><rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">會話 + 記憶</text><text x="15" y="44" class="mini">上下文 · Profile · 狀態</text></g>
  <g transform="translate(740 438)"><rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">路由 + 准入</text><text x="15" y="44" class="mini">本地優先 · 雲端預設關閉</text></g>
  <g transform="translate(960 438)"><rect width="205" height="58" fill="#101317" stroke="#30343a"/><text x="15" y="24" class="mono">審計 + 監控</text><text x="15" y="44" class="mini">健康 · 日誌 · 憑證</text></g>

  <path d="M410 521V568M637 521V568M865 521V568" class="cyan-line" marker-end="url(#arrowCyan)"/>
  <rect x="55" y="570" width="1165" height="264" fill="#0b0d10" stroke="#30343a" stroke-width="1.5"/>
  <text x="78" y="603" class="step">03 / 本地執行面</text>
  <g transform="translate(80 625)">
    <rect width="335" height="180" fill="url(#redWash)" stroke="#ff655d" stroke-opacity=".5"/><text x="20" y="31" class="label-red">模型 RUNTIME</text><text x="20" y="65" class="head">GGUF 直接載入 + LLM / VLM</text><text x="20" y="98" class="mono">llama.cpp 相容 Runtime</text><text x="20" y="123" class="mono">排程 · KV Cache · Streaming</text><text x="20" y="148" class="mono">MAGNE 定制 NPU Backend</text>
  </g>
  <g transform="translate(445 625)">
    <rect width="335" height="180" fill="url(#cyanWash)" stroke="#74d8dd" stroke-opacity=".48"/><text x="20" y="31" class="label">知識 + AI 能力服務</text><text x="20" y="65" class="head">RAG 保留在本地</text><text x="20" y="98" class="mono">解析 · OCR · Document</text><text x="20" y="123" class="mono">Embedding · Rerank · Citation</text><text x="20" y="148" class="mono">ASR / TTS · 視覺能力</text>
  </g>
  <g transform="translate(810 625)">
    <rect width="385" height="180" fill="#0f1114" stroke="#3a4148"/><text x="20" y="31" class="label">工具 + 操作沙箱</text><text x="20" y="65" class="head">AGENT 在策略內執行</text><text x="20" y="98" class="mono">MCP / Skills · File Service</text><text x="20" y="123" class="mono">工具隔離 · 系統訪問</text><text x="20" y="148" class="mono">批准閘門 · 失敗復原</text>
  </g>

  <path d="M247 805V858M612 805V858M1002 805V858" class="cyan-line" marker-end="url(#arrowGreen)"/>
  <rect x="55" y="860" width="1165" height="74" fill="#0c100e" stroke="#91f488" stroke-opacity=".48" stroke-width="1.5"/>
  <text x="80" y="892" class="result">04 / 本地業務結果</text>
  <text x="80" y="918" class="mono">帶引用答案 · 經批准工具操作 · 本地審計記錄 · 可選簽名憑證</text>
  <rect x="55" y="956" width="1165" height="62" fill="#0d0e11" stroke="#30343a"/>
  <text x="78" y="983" class="step">裝置基礎</text><text x="285" y="992" class="head">UBUNTU · ARM64 HOST · MAGNE 定制 NPU · 3D DRAM · 本地儲存</text>

  <rect x="1260" y="150" width="285" height="868" fill="#0b0d10" stroke="#ff655d" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="1260" y="150" width="7" height="868" fill="#ff655d" opacity=".7"/>
  <text x="1288" y="185" class="label-red">可選 / W3 信任通道 · TARGET</text>
  <text x="1288" y="220" class="head">只上鏈憑證，不上鏈私有資料</text>
  <path d="M1220 433H1290" class="red-line dash" marker-end="url(#arrowCyan)"/>
  <path d="M1220 894H1290" class="red-line dash" marker-end="url(#arrowCyan)"/>
  <g transform="translate(1288 270)"><text class="step" y="0">01</text><text x="45" y="0" class="mono">裝置 + AGENT 身份</text><path d="M0 20H225" class="line"/></g>
  <g transform="translate(1288 355)"><text class="step" y="0">02</text><text x="45" y="0" class="mono">策略批准</text><path d="M0 20H225" class="line"/></g>
  <g transform="translate(1288 440)"><text class="step" y="0">03</text><text x="45" y="0" class="mono">簽名執行憑證</text><path d="M0 20H225" class="line"/></g>
  <g transform="translate(1288 525)"><text class="step" y="0">04</text><text x="45" y="0" class="mono">審計摘要</text><path d="M0 20H225" class="line"/></g>
  <g transform="translate(1288 610)"><text class="step" y="0">05</text><text x="45" y="0" class="mono">AGENTPAY 結算</text><path d="M0 20H225" class="line"/></g>
  <text x="1288" y="705" class="label-red">永不上鏈</text>
  <text x="1288" y="740" class="mono">企業檔案</text><text x="1288" y="770" class="mono">Prompt + 完整輸出</text><text x="1288" y="800" class="mono">私鑰</text><text x="1288" y="830" class="mono">原始知識庫</text>
  <rect x="1288" y="878" width="225" height="84" fill="#111216" stroke="#30343a"/>
  <text x="1305" y="909" class="step">預設狀態</text><text x="1305" y="939" class="head">本地 / OFF-CHAIN</text>
</svg>
